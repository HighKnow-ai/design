name: Release

# Publishes @highknow/design to npm. A `v*` tag is the only thing that starts it, and the tag is
# pushed by the private source of truth's export (a `design-vX.Y.Z` tag there becomes `vX.Y.Z`
# here, at the commit exported from it), never by hand, and only once that commit is on `main`.
# There is deliberately no workflow_dispatch: a version typed apart from the tag is how the two
# drift.
#
# NPM TRUSTED PUBLISHING (OIDC). No npm token exists anywhere. npm trusts this repository and this
# workflow FILE NAME (`release.yml`), configured on the package's settings on npmjs.com; renaming
# this file, or the repository, stops publishing until that configuration is changed with it.
# Provenance is attached automatically, without `--provenance`, because the repository and the
# package are both public; it needs npm 11.5.1 or later and a GitHub-hosted runner.
#
# Same runner and pinned actions as ci.yml.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # The OIDC token npm exchanges for a short-lived publish credential.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # One publish per tag, never two at once.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Built only from a commit ci.yml passed. `main` holds nothing else (it moves only by
      # ci.yml's fast-forward after a green run, and its ruleset requires `build`), so "the tag is
      # on main" is that statement, read from git.
      - name: The tagged commit passed CI (it is on main)
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main, so ci.yml has not passed on it. Not publishing."
            exit 1
          fi

      # THE TAG IS THE VERSION. First, before anything is installed: a tag that disagrees with
      # package.json publishes nothing.
      - name: The tag equals the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION; bump the version in the release pull request, then tag"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org

      - name: npm can publish by OIDC (11.5.1 or later)
        run: |
          npm --version
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error("npm " + process.argv[1] + " cannot publish by trusted publishing; it needs 11.5.1"); process.exit(1); }
          ' "$(npm --version)"

      - run: npm install --global pnpm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

      # No token and no --provenance: trusted publishing supplies both. `publishConfig.access` is
      # public in package.json, as a scoped package's first publish needs.
      - run: npm publish

      # Do not trust the publish's own success: read back what the registry holds. The version must
      # exist and carry an attestation, or provenance did not land and the release is not what
      # this repository promises.
      - name: Read back the version and its provenance
        run: |
          for attempt in 1 2 3 4 5 6; do
            if ATT=$(npm view "@highknow/design@$VERSION" dist.attestations --json 2>/dev/null) && [ -n "$ATT" ]; then
              break
            fi
            sleep 10
          done
          echo "$ATT"
          node -e '
            const att = JSON.parse(process.argv[1] || "null");
            if (!att || !att.provenance || !String(att.provenance.predicateType || "").includes("slsa.dev/provenance")) {
              console.error("@highknow/design@" + process.env.VERSION + " has no SLSA provenance attestation on the registry");
              process.exit(1);
            }
            console.log("provenance: " + att.provenance.predicateType + " at " + att.url);
          ' "$ATT"
